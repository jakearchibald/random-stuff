<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>text-box-trim</title>
    <style>
      @font-face {
        font-family: Inter;
        /* Variable font: declare the full axis range so the browser knows
           it can synthesise any weight in it rather than faux-bolding. */
        font-weight: 100 900;
        src: url('inter.ttf') format('truetype-variations');
        ascent-override: 105%;
      }

      body {
        font-family: Inter, sans-serif;
        margin: 3rem;
        background: #222;
        color: #fff;
      }

      .stack {
        /* Everything below is sized in em, so scale the whole demo by
           setting font-size here. */
        font-size: 2.5em;
        font-weight: 600;
        line-height: 1.5;

        display: grid;
        /* One cell: every copy occupies it, so they overlay. Baseline
           alignment makes the first line of each copy share an anchor,
           regardless of how much leading each one trims. */
        grid-template: 'text';
        align-items: baseline;
        justify-items: center;
        color: transparent;
        margin: 0 0 1em;

        & > p {
          grid-area: text;
          margin: 0;
          padding: 0 1.5em;
        }
      }

      /* Back to front: least trimmed first, so each smaller box paints on
         top of the larger ones behind it. */
      .text {
        background: #1d3f6e;
        text-box: trim-both text alphabetic;
      }
      .descender {
        background: #3d68ab;
        text-box: trim-both text;
      }
      .rendered-text {
        color: #fff;
      }
      p.line-height {
        background: rgb(255, 255, 255, 0.2);
        line-height: 1.5;
        padding: 0 1.3em;
      }
      p.full {
        background: #1d3f6e;
        line-height: 1.5;
      }
      p.text-top {
        background: #1d3f6e;
        text-box: trim-start text;
      }
      p.text-both {
        background: #1d3f6e;
        text-box: trim-both text;
      }
      p.text-cap {
        background: #1d3f6e;
        text-box: trim-both cap text;
      }
      p.text-ex {
        background: #1d3f6e;
        text-box: trim-both ex text;
      }
      p.alphabetic-ex {
        background: #1d3f6e;
        text-box: trim-both ex alphabetic;
      }
      .span-trim {
        text-box: trim-both ex alphabetic;
        background: green;
      }
      .multiline {
        background: #16304f;
        line-height: 1.5;
        width: fit-content;

        & > p {
          display: grid;
          grid-area: auto;
          grid-row: 1 / 3;
          grid-column: 1 / 1;
          grid-template-rows: subgrid;
          padding: 0;

          /* The topmost trimmed box is the lightest step in the ramp, so
             white text needs a dark shadow to stay legible over it. */
          &.rendered-text {
            text-shadow:
              0 1px 2px rgb(0 0 0 / 0.6),
              0 0 0.4em rgb(0 0 0 / 0.4);
          }

          & > span {
            display: contents;

            & > span {
              align-self: baseline;
              padding: 0 1.5em;

              &:nth-child(2) {
                grid-row: 2 / 3;
              }
            }
          }
        }
      }
      .span-ex-alphabetic span {
        text-box: trim-both ex alphabetic;
        background: #6f9fcc;
      }
      .span-cap-alphabetic span {
        text-box: trim-both cap alphabetic;
        background: #4a7aa8;
      }
      .span-text-text span {
        text-box: trim-both text text;
        background: #2a5584;
      }
    </style>
  </head>
  <body>
    <div class="stack">
      <p class="descender">Styling</p>
      <p class="text">Styling</p>
      <p class="line-height">Styling</p>
      <p class="rendered-text">Styling</p>
    </div>
    <div class="stack">
      <p class="full rendered-text">Styling</p>
    </div>
    <div class="stack">
      <p class="text-top rendered-text">Styling</p>
    </div>
    <div class="stack">
      <p class="text-both rendered-text">Styling</p>
    </div>
    <div class="stack">
      <p class="text-cap rendered-text">Styling</p>
    </div>
    <div class="stack">
      <p class="text-ex rendered-text">Styling</p>
    </div>
    <div class="stack">
      <p class="alphabetic-ex rendered-text">Styling</p>
    </div>

    <div class="stack">
      <p class="full rendered-text">
        <span class="span-trim"
          >This is a run of<br />text that includes Styling</span
        >
      </p>
    </div>

    <div class="stack multiline">
      <p>
        <span class="span-text-text">
          <span class="line">Styling is fun</span>
          <span class="line">for everyone!</span>
        </span>
      </p>
      <p>
        <span class="span-cap-alphabetic">
          <span class="line">Styling is fun</span>
          <span class="line">for everyone!</span>
        </span>
      </p>
      <p>
        <span class="span-ex-alphabetic">
          <span class="line">Styling is fun</span>
          <span class="line">for everyone!</span>
        </span>
      </p>
      <p class="rendered-text">
        <span>
          <span class="line">Styling is fun</span>
          <span class="line">for everyone!</span>
        </span>
      </p>
    </div>
  </body>
</html>
