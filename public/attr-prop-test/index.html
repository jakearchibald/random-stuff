<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>attr() cascade test</title>
    <style>
      @property --reg {
        syntax: '<string>';
        inherits: true;
        initial-value: 'hi';
      }

      @property --foo {
        syntax: '<color>';
        inherits: true;
        initial-value: red;
      }

      .outer {
        --unreg: attr(data-foo);
        --reg: attr(data-foo);
        --foo: green;
        background: attr(data-bar type(<color>));
      }

      .inner::before {
        content: var(--unreg);
      }
      .inner::after {
        content: var(--reg);
      }
    </style>
  </head>
  <body>
    <div class="outer" data-foo="outer" data-bar="var(--foo)">
      <div class="inner" data-foo="inner"></div>
    </div>
  </body>
</html>
