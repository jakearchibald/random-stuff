<!doctype html>
<meta
  id="viewport"
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>
<title>env(safe-area-inset-*) within requestFullscreen</title>
<style>
  #fs {
    box-sizing: border-box;
    background: #c33;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
      env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #fs:fullscreen {
    width: 100%;
    height: 100%;
  }
  #fs:not(:fullscreen) #exit {
    display: none;
  }
  .safe-area {
    box-sizing: border-box;
    height: 100%;
    min-height: 200px;
    background: #3a3;
    padding: 1em;
    font:
      16px/1.4 system-ui,
      sans-serif;
  }
</style>
<p>
  The green box should sit inside the safe area. Red shows the
  <code>env(safe-area-inset-*)</code> padding.
</p>
<p>
  <label><input type="checkbox" id="cover" /> viewport-fit=cover</label>
</p>
<p><button id="enter">Enter fullscreen</button></p>
<div id="fs">
  <div class="safe-area">
    <pre id="values"></pre>
    <button id="exit">Exit fullscreen</button>
  </div>
</div>
<script>
  const sides = ['top', 'right', 'bottom', 'left'];

  function update() {
    const style = getComputedStyle(fs);
    values.textContent =
      `fullscreen: ${document.fullscreenElement === fs}\n` +
      sides
        .map((side) => `safe-area-inset-${side}: ${style[`padding-${side}`]}`)
        .join('\n');
    requestAnimationFrame(update);
  }

  update();

  enter.onclick = () => fs.requestFullscreen();
  exit.onclick = () => document.exitFullscreen();

  cover.onchange = () => {
    viewport.content =
      'width=device-width, initial-scale=1.0' +
      (cover.checked ? ', viewport-fit=cover' : '');
  };

  // Browsers can restore checkbox state on reload
  cover.onchange();
</script>
